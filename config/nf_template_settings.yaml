# Integration settings of the NF binned template (src/nf_template), one block per analysis binning.
#
# Each block:
#   status      validated / not validated
#   model       NF model the settings were checked with
#   binning     the analysis binning (from the DC4 dataio yaml)
#   quadrature  arguments of NFBinnedTemplate.compute / get_binned_background
#   template    arguments of NFBinnedTemplate(...)
#   validation  where the settings were checked (notebooks, output files)
#
# Angles in deg, energies in keV.

#----------------------------------------------------------------------------------------------
#--------------------------------- 511 keV line ---------------------------------------------
#----------------------------------------------------------------------------------------------
dc4_511keV:
  status: validated
  model: model/nfbackground_part-01_v3-00.fits          # component 01 only

  binning:
    source: dataio_511.yaml
    em_edges_kev: [509.0, 513.0]                         # 1 energy bin
    phi_bin_deg: 3                                       # 60 bins, 0-180 deg
    nside: 16
    scheme: ring

  quadrature:
    subpixel_level: 2
    n_em_per_bin: 4
    n_phi_per_bin: 4
    em_breaks_kev: [511.0]
    phi_breaks_deg: [15.5, 16.0, 16.5, 17.0]

  template:
    seam_delta_deg: 0.2
    polar_cap_deg: 4.0
    polar_subpixel_level: 5
    pole_colat_deg: 1.0
    pole_subpixel_level: 7
    near_pole_cap_deg: 10.0
    near_pole_subpixel_level: 3

  validation:
    - notebooks/02_511_template/09_nf_background.ipynb, Sections 5-6: Em and Phi quadrature (FINAL)
    - notebooks/02_511_template/09_nf_background.ipynb, Sections 10-11: chi = 0 seam and pole corrections
    - data/NF_background/convergence/part-01_k2_vs_k3_block0of1.hdf5: sky level k = 2 vs k = 3

  # The quadrature block above is what the part 01 template used (and what notebooks 11 and 13 read).
  # Parts 02-04 use the same settings except phi_breaks_deg, extended around phi = 90 deg
  # (edge + peak in parts 03 and 04), as in scripts/compute_full_sky_template.py.
  # Validated in notebooks/02_511_template/13_all_components_511keV.ipynb on test pixels, parts 01-04:
  # Em (Section 5), Phi (Sections 6, 6.2), k = 2 vs 3 (Section 7), polar pixel 0 (Section 8).
  # Not re-tested for 02-04: chi = 0 strip and near-pole level (part 01 values applied).
  components:
    # Groups as requested from Pascal (Figure 10 labels of the DC4 background paper);
    # NOT verified against his training selections.
    part-01: {group: EGB photons, labels: b, phi_breaks_deg: [15.5, 16.0, 16.5, 17.0]}
    part-02: {group: albedo photons, labels: c, phi_breaks_deg: [15.5, 16.0, 16.5, 17.0, 89.5, 90.5, 91.0, 91.5, 92.0]}
    part-03: {group: albedo + primary positrons, labels: f + m, phi_breaks_deg: [15.5, 16.0, 16.5, 17.0, 89.5, 90.5, 91.0, 91.5, 92.0]}
    part-04: {group: combined, labels: e + g + i + j + k + l, phi_breaks_deg: [15.5, 16.0, 16.5, 17.0, 89.5, 90.5, 91.0, 91.5, 92.0]}
    part-05: {group: SAA photons, labels: h, excluded: DC4 excludes SAA passages}

#----------------------------------------------------------------------------------------------
#--------------------------------- Crab continuum ---------------------------------------------
#----------------------------------------------------------------------------------------------

dc4_crab_continuum:
  status: not validated
  model:  model/nfbackground_part-01_v3-00.fits          # component 01 only

  binning:
    source: dataio_continuum.yaml
    em_edges_kev: [100.0, 158.489, 251.189, 398.107, 630.957, 1000.0,
                   1584.89, 2511.89, 3981.07, 6309.57, 10000.0]     # 10 energy bins
    phi_bin_deg: 6                                       # 30 bins, 0-180 deg
    nside: 8
    scheme: ring

  quadrature: null                                       # to be determined by a convergence check
  template: null
  validation: []
